# Optional: deploy with wrangler instead of the dashboard (README.md). No secrets and no account id here: the token is
# set with `wrangler secret put GITHUB_TOKEN`, and wrangler asks which account to use on the first deploy.
name = "datafromzero-feedback"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
GITHUB_REPO = "datafromzero/datafromzero.github.io"

# Optional extra rate limit per sender address (3 messages a minute, counted in each Cloudflare location, best effort).
# Uncomment to use it; the Worker works without it and always keeps its own in-memory limit.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
#   [ratelimits.simple]
#   limit = 3
#   period = 60

# Cloudflare's invocation logs keep "the Request, Response and related metadata" of every call (Workers Logs docs:
# developers.cloudflare.com/workers/observability/logs/workers-logs/), and the docs do not say which request headers.
# Logs, traces and invocation logs are all off (as set in the dashboard on 2026-11-24), so nothing about a sender is
# stored. Watch the Worker's own status lines live with `npx wrangler tail` while testing.
[observability]
enabled = false
