[project]
name = "ml-starter-llm"
version = "0.1.0"
description = "The language-model half of the ML starter capstone: a retrieval answerer behind an HTTP endpoint."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "numpy==2.5.3",
    "pydantic==2.14.4",
    "sentence-transformers==6.3.0",
    "torch==2.15.0",
    "transformers==5.24.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "pytest==9.2.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
