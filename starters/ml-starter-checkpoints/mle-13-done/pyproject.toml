[project]
name = "ml-starter"
version = "0.1.0"
description = "The starter repository of the datafromzero Machine Learning Engineer track: one churn model, shipped lesson by lesson."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "duckdb==2.0.0",
    "fastapi==0.165.0",
    "mlflow==3.18.0",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "pandera==0.36.0",
    "pydantic==2.14.4",
    "scikit-learn==1.9.1",
    "skops==0.16.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "pytest==9.2.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ml_starter"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
