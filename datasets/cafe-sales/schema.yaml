# cafe-sales: machine-readable column definitions (SPEC §7). Human-readable version: README.md.
name: cafe-sales
version: 1
license: CC-BY-4.0
synthetic: true
currency: USD
period: { start: 2026-01-01, end: 2026-06-30 }
generator: scripts/build-cafe-sales.py
tables:
  - name: stores
    file: v1/stores.csv
    rows: 3
    primary_key: store_id
    columns:
      - { name: store_id, type: integer, nullable: false }
      - { name: store_name, type: text, nullable: false }
      - { name: city, type: text, nullable: false }
      - { name: opened_on, type: date, nullable: false }
  - name: customers
    file: v1/customers.csv
    rows: 150
    primary_key: customer_id
    columns:
      - { name: customer_id, type: integer, nullable: false }
      - { name: signup_date, type: date, nullable: false }
      - { name: city, type: text, nullable: false }
      - { name: loyalty_tier, type: text, nullable: false, values: [bronze, silver, gold] }
      - { name: referred_by, type: integer, nullable: true, references: customers.customer_id }
  - name: products
    file: v1/products.csv
    rows: 16
    primary_key: product_id
    columns:
      - { name: product_id, type: integer, nullable: false }
      - { name: product_name, type: text, nullable: false }
      - { name: category, type: text, nullable: false, values: [coffee, tea, bakery, food] }
      - { name: unit_price_usd, type: decimal, scale: 2, nullable: false }
  - name: orders
    file: v1/orders.csv
    rows: 1800
    primary_key: order_id
    columns:
      - { name: order_id, type: integer, nullable: false }
      - { name: customer_id, type: integer, nullable: true, references: customers.customer_id }
      - { name: store_id, type: integer, nullable: false, references: stores.store_id }
      - { name: ordered_at, type: timestamp, nullable: false }
      - { name: status, type: text, nullable: false, values: [completed, canceled] }
      - { name: payment_method, type: text, nullable: false, values: [card, mobile, cash] }
  - name: order_items
    file: v1/order_items.csv
    rows: 3287
    primary_key: order_item_id
    columns:
      - { name: order_item_id, type: integer, nullable: false }
      - { name: order_id, type: integer, nullable: false, references: orders.order_id }
      - { name: product_id, type: integer, nullable: false, references: products.product_id }
      - { name: quantity, type: integer, nullable: false }
      - { name: discount_usd, type: decimal, scale: 2, nullable: false }
