# cafe-sales: machine-readable column definitions (SPEC §7). Human-readable version: README.md.
name: cafe-sales
version: 1
license: CC-BY-4.0
synthetic: true
currency: USD
period: { start: 2026-01-01, end: 2026-06-30 }
generator: scripts/build-cafe-sales.py
tables:
  - name: stores
    file: v1/stores.csv
    rows: 3
    primary_key: store_id
    columns:
      - { name: store_id, type: integer, nullable: false }
      - { name: store_name, type: text, nullable: false }
      - { name: city, type: text, nullable: false }
      - { name: opened_on, type: date, nullable: false }
  - name: customers
    file: v1/customers.csv
    rows: 150
    primary_key: customer_id
    columns:
      - { name: customer_id, type: integer, nullable: false }
      - { name: signup_date, type: date, nullable: false }
      - { name: city, type: text, nullable: false }
      - { name: loyalty_tier, type: text, nullable: false, values: [bronze, silver, gold] }
      - { name: referred_by, type: integer, nullable: true, references: customers.customer_id }
  - name: products
    file: v1/products.csv
    rows: 16
    primary_key: product_id
    columns:
      - { name: product_id, type: integer, nullable: false }
      - { name: product_name, type: text, nullable: false }
      - { name: category, type: text, nullable: false, values: [coffee, tea, bakery, food] }
      - { name: unit_price_usd, type: decimal, scale: 2, nullable: false }
  - name: orders
    file: v1/orders.csv
    rows: 1800
    primary_key: order_id
    columns:
      - { name: order_id, type: integer, nullable: false }
      - { name: customer_id, type: integer, nullable: true, references: customers.customer_id }
      - { name: store_id, type: integer, nullable: false, references: stores.store_id }
      - { name: ordered_at, type: timestamp, nullable: false }
      - { name: status, type: text, nullable: false, values: [completed, canceled] }
      - { name: payment_method, type: text, nullable: false, values: [card, mobile, cash] }
  - name: order_items
    file: v1/order_items.csv
    rows: 3287
    primary_key: order_item_id
    columns:
      - { name: order_item_id, type: integer, nullable: false }
      - { name: order_id, type: integer, nullable: false, references: orders.order_id }
      - { name: product_id, type: integer, nullable: false, references: products.product_id }
      - { name: quantity, type: integer, nullable: false }
      - { name: discount_usd, type: decimal, scale: 2, nullable: false }
extras:
  # Derived, teaching-only files (SPEC D57); not tables of the dataset, and v1/ files above are unchanged.
  - name: settlements
    file: v1/extras/settlements.csv
    rows: 1557
    license: CC-BY-4.0
    generator: scripts/build-settlements-extract.py
    note: a card processor's export derived from the completed card and mobile orders, with ten planted defects (README, Extras)
    columns:
      - { name: settlement_id, type: text, nullable: false }
      - { name: order_ref, type: text, nullable: false }
      - { name: merchant, type: text, nullable: true }
      - { name: settled_at, type: text, nullable: false, note: "MM/DD/YYYY HH:MM, UTC" }
      - { name: amount, type: text, nullable: false, note: "$12.50; three rows are whole cents" }
      - { name: type, type: text, nullable: false, values: [SALE, TEST] }
  - name: sales_clean
    file: v1/extras/sales_clean.csv
    rows: 3286
    license: CC-BY-4.0
    generator: scripts/build-sales-clean.py
    note: one sold line of a completed order, order 2075 corrected to quantity 2
    columns:
      - { name: line_id, type: integer, nullable: false }
      - { name: order_id, type: integer, nullable: false }
      - { name: ordered_at, type: timestamp, nullable: false }
      - { name: order_date, type: date, nullable: false }
      - { name: store, type: text, nullable: false }
      - { name: product, type: text, nullable: false }
      - { name: category, type: text, nullable: false, values: [coffee, tea, bakery, food] }
      - { name: quantity, type: integer, nullable: false }
      - { name: unit_price, type: decimal, scale: 2, nullable: false }
      - { name: discount, type: decimal, scale: 2, nullable: false }
      - { name: amount, type: decimal, scale: 2, nullable: false }
      - { name: payment_method, type: text, nullable: false, values: [card, mobile, cash] }
      - { name: loyalty_tier, type: text, nullable: false, values: [bronze, silver, gold, walk-in] }
      - { name: hour, type: text, nullable: false, note: "07h to 17h" }
  - name: take_home_export
    file: v1/extras/take_home_export.csv
    rows: 2007
    license: CC-BY-4.0
    generator: scripts/build-take-home-extract.py
    note: the till's export of April to June order lines with five planted defects and a TOTAL row (README, Extras)
    columns:
      - { name: line_id, type: integer, nullable: true, note: "empty on the TOTAL row" }
      - { name: order_id, type: integer, nullable: true }
      - { name: ordered_at, type: text, nullable: true, note: "two text formats" }
      - { name: store_code, type: text, nullable: true }
      - { name: store, type: text, nullable: true }
      - { name: customer_id, type: integer, nullable: true }
      - { name: product, type: text, nullable: false }
      - { name: category, type: text, nullable: true }
      - { name: quantity, type: integer, nullable: false }
      - { name: unit_price, type: decimal, scale: 2, nullable: true }
      - { name: discount, type: decimal, scale: 2, nullable: false }
      - { name: line_total, type: decimal, scale: 2, nullable: false }
      - { name: status, type: text, nullable: true }
      - { name: payment_method, type: text, nullable: true }
