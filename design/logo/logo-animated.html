<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data roadmap — Logo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#f4f4f4}
body{display:grid;place-items:center;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
.logo{width:min(60vw,340px);height:auto;overflow:visible}
.trace{fill:none;stroke:#f4f4f4;stroke-width:1.2}
</style>
</head>
<body>
<svg class="logo " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle class="trace" cx="50" cy="50" r="46" transform="rotate(-90 50 50)"/><circle class="disc" cx="50" cy="50" r="46" fill="#f4f4f4"/><path class="void" d="M29 31C29 17 71 17 71 31V69C71 83 29 83 29 69Z" fill="#000"/><g class="bands" fill="none" stroke="#f4f4f4" stroke-width="4" stroke-linecap="round"><path d="M29 31C29 45 71 45 71 31"/><path d="M29 45C29 59 71 59 71 45"/><path d="M29 59C29 73 71 73 71 59"/></g></svg>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
(function(){
  const trace = document.querySelector('.trace');
  if(!window.gsap || matchMedia('(prefers-reduced-motion: reduce)').matches){ trace.remove(); return; }
  const T = trace.getTotalLength();
  const bands = gsap.utils.toArray('.bands path');
  bands.forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; });
  trace.style.strokeDasharray = T;
  gsap.set(bands, {opacity:0});
  gsap.set('.disc', {svgOrigin:'50 50'});
  gsap.set('.void', {svgOrigin:'50 50'});

  const intro = () => gsap.timeline()
    // 1. light traces the edge of the disc
    .fromTo(trace, {strokeDashoffset:T, opacity:1}, {strokeDashoffset:0, duration:1.1, ease:'power2.inOut'})
    // 2. the disc of light fills in
    .fromTo('.disc', {scale:0}, {scale:1, duration:1, ease:'expo.out'}, '-=.15')
    .to(trace, {opacity:0, duration:.3}, '<.3')
    // 3. the void — the database — opens at the centre
    .fromTo('.void', {scaleY:0, scaleX:.7}, {scaleY:1, scaleX:1, duration:1, ease:'expo.out'}, '-=.7')
    // 4. its layers are traced in light
    .fromTo(bands, {strokeDashoffset:(i, el) => el.getTotalLength(), opacity:0}, {strokeDashoffset:0, opacity:1, duration:.6, stagger:.12, ease:'power2.out'}, '-=.35');

  intro();
  document.body.addEventListener('click', intro);   // tap to replay
})();
</script>
</body>
</html>
