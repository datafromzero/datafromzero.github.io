<!doctype html>
<!-- Social preview card (og:image), 1200×630. Source of public/og.png: run `node scripts/build-og.mjs`. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
	@font-face { font-family: 'Geist'; font-weight: 500; src: url('../../node_modules/@fontsource/geist/files/geist-latin-500-normal.woff2') format('woff2'); }
	@font-face { font-family: 'Geist'; font-weight: 600; src: url('../../node_modules/@fontsource/geist/files/geist-latin-600-normal.woff2') format('woff2'); }
	@font-face { font-family: 'Geist Mono'; font-weight: 400; src: url('../../node_modules/@fontsource/geist-mono/files/geist-mono-latin-400-normal.woff2') format('woff2'); }
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 1200px; height: 630px; }
	body {
		position: relative;
		overflow: hidden;
		padding: 64px 80px;
		display: grid;
		grid-template-rows: auto 1fr auto;
		background: #000 radial-gradient(circle, #2a2a2a 1.5px, transparent 1.6px) 0 0 / 40px 40px;
		color: #f4f4f4;
		font-family: 'Geist', sans-serif;
	}
	.brand { display: flex; align-items: center; gap: 18px; font-weight: 500; font-size: 32px; letter-spacing: -0.01em; }
	.brand svg { width: 64px; height: 64px; }
	.mid { align-self: center; display: grid; gap: 28px; }
	h1 { font-weight: 600; font-size: 124px; line-height: 1; letter-spacing: -0.045em; white-space: nowrap; }
	.cell { position: relative; display: inline-block; padding: 0 14px; margin: 0 6px; border: 4px solid #f4f4f4; }
	.cell::after { content: ''; position: absolute; right: -10px; bottom: -10px; width: 16px; height: 16px; background: #f4f4f4; border: 3px solid #000; }
	p { max-width: 40ch; font-weight: 500; font-size: 34px; line-height: 1.3; color: #a8a8a8; letter-spacing: -0.01em; }
	.foot { display: flex; justify-content: space-between; align-items: end; font: 400 22px/1 'Geist Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; color: #8a8a8a; }
	.foot span:last-child { text-transform: none; letter-spacing: 0.02em; }
</style>
</head>
<body>
	<div class="brand">
		<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#f4f4f4"/><path d="M29 31C29 17 71 17 71 31V69C71 83 29 83 29 69Z" fill="#000"/><g fill="none" stroke="#f4f4f4" stroke-width="4" stroke-linecap="round"><path d="M29 31C29 45 71 45 71 31"/><path d="M29 45C29 59 71 59 71 45"/><path d="M29 59C29 73 71 73 71 59"/></g></svg>
		datafromzero
	</div>
	<div class="mid">
		<h1>From <span class="cell">A1</span> to AI.</h1>
		<p>A free, open roadmap for learning data from zero.</p>
	</div>
	<div class="foot"><span>Excel → SQL → Python → 4 careers</span><span>datafromzero.github.io</span></div>
</body>
</html>
