version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # rehype-katex 7 renders with katex 0.16.x; a newer root katex only adds a second copy.
      # Lift this when rehype-katex accepts katex >= 0.17.
      - dependency-name: katex
        versions: ['>=0.17.0']
    groups:
      # Astro majors need their own full-CI PR (SPEC §12); the group keeps the framework in step.
      astro:
        patterns:
          - astro
          - '@astrojs/*'
          - astro-auto-import
      gsap:
        patterns:
          - gsap
      dev-tooling:
        patterns:
          - cspell
          - markdownlint-cli2
          - '@lhci/cli'
          - starlight-links-validator
          - yaml
      # Catch-all, after the named groups: katex, rehype-katex, remark-math, @fontsource/*, ...
      runtime:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
