version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Astro majors need their own full-CI PR (SPEC §12); the group keeps the framework in step.
      astro:
        patterns:
          - astro
          - '@astrojs/*'
          - astro-auto-import
      gsap:
        patterns:
          - gsap
      dev-tooling:
        patterns:
          - cspell
          - markdownlint-cli2
          - '@lhci/cli'
          - starlight-links-validator
          - yaml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
