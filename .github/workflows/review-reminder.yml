name: Review reminder

on:
  schedule:
    - cron: '23 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  stale-reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: List lessons not reviewed for 18 months
        id: report
        run: |
          node scripts/review-report.ts --months 18 --output review-report.md
          if grep -q "were last reviewed" review-report.md; then echo "stale=true" >> "$GITHUB_OUTPUT"; fi
      - name: Open or update the issue
        if: steps.report.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Lessons due for review
        run: |
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file review-report.md
          else
            gh issue create --title "$TITLE" --body-file review-report.md
          fi
