name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Astro build: Zod content schemas, content rules, starlight-links-validator (links and anchors).
      - name: Build and validate content
        run: npm run build
      - name: Prerequisite graph
        run: npm run check:graph
      - name: Unit tests
        run: npm run test:unit
      - name: Fixture tests
        run: npm run test:fixtures
      - name: Spelling
        run: npm run spell
      - name: Markdown style
        run: npm run lint:md
      - name: Knowledge graph is current
        run: npm run check:kb
      - name: Notebooks have no outputs
        run: |
          if [ -n "$(find notebooks -name '*.ipynb' 2>/dev/null | head -1)" ]; then
            python3 -m pip install nbstripout==0.8.1
            npm run check:notebooks
          else
            echo "No notebooks yet; skipping nbstripout."
          fi

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Builds the valid fixture site (tests/fixtures/valid) and audits /, one lesson and one reference page
      # on mobile: performance >= 0.9, accessibility >= 0.95 (lighthouserc.cjs). Uses the runner's Chrome.
      - name: Lighthouse CI
        run: npm run lighthouse
