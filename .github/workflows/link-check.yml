name: External link check

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# Non-blocking: a failure opens or updates an issue and never gates a merge.
permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check external links in the built site
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Only http(s) links; this site's own pages are covered by starlight-links-validator.
          args: >-
            --no-progress --scheme https --scheme http --max-retries 3
            --root-dir "${{ github.workspace }}/dist"
            --exclude '^https://datafromzero\.github\.io'
            --exclude-path 'dist/pagefind'
            'dist/**/*.html'
          output: lychee-report.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Open or update the issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Broken external links
        run: |
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file lychee-report.md
            gh issue comment "$existing" --body "Weekly check found broken links again: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            gh issue create --title "$TITLE" --body-file lychee-report.md
          fi
