name: Report a problem on a page
description: Something is wrong, unclear or broken on a page of the site.
title: "[Report] "
labels: ["report"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page. The site fills this in when you start from "Report a problem".
      placeholder: https://datafromzero.github.io/excel/xlookup/
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Bug on the page
        - Feedback
        - Content error
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: Tell us what you saw and what you expected. You can paste or drag a screenshot into this box.
    validations:
      required: true
