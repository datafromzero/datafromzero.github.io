name: Research report
description: A finding about competitors, tools, sources or careers that may affect the roadmap.
title: "[Research] "
labels: ["research"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Competitor change
        - Curriculum gap
        - Tool or version change
        - Source or link problem
        - Career trend
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences, in your own words.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: One line per source - URL, date accessed, and what it shows.
      placeholder: "- https://example.org/page (accessed 2026-11-15): what the page shows"
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Affected datafromzero pages
      description: URLs (e.g. /sql/joins/) or lesson ids. Write "none yet" if no page exists.
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: Suggested action
      description: What should change. Do not draft lesson text.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High - a page is wrong or broken, or URLs/roadmap structure are affected
        - Medium - outdated but still correct, or a clear beginner-level gap
        - Low - worth watching
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: Confidence
      options:
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Evidence links work and include access dates
          required: true
        - label: No text, code or images copied from other sites
          required: true
