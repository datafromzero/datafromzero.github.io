  - stage: core
    summary: "The advanced core every track shares, in five parts of about four hours each (SPEC D49): statistics I, statistics II and decisions, shapes of data, engineering on your laptop, platform and the AI era. One project grows on cafe-sales part by part."
    restructured: "2026-11-20, owner decision (SPEC D49): 36 lessons, was 25. Eleven new lessons (data-beyond-tables, a-feel-for-scale, the seven engineering lessons of D48, prompting-with-the-data-in-the-room, trust-but-verify-ai-output) and a new order; ids and slugs of the 25 existing lessons are unchanged. Parts: 1 orders 10-70, 2 orders 80-150, 3 orders 160-220, 4 orders 230-310, 5 orders 320-360."
    lessons:
      - id: core-study-design-and-data-types
        slug: study-design-and-data-types
        title: Data types, units and how data was collected
        description: Tell categorical from numeric data, name the unit and grain of a dataset, and separate an observational study from an experiment.
        order: 10
        level: beginner
        duration: 20
        objectives:
          - Classify a column as categorical or numeric, discrete or continuous
          - State the unit of observation of a dataset
          - Tell an observational study from an experiment
          - Name a confounder that could explain an observed difference
        prerequisites:
          - python-pandas-groupby-aggregate
        datasets: &a7
          - app-events
        tool: colab
        careers:
          - DA
          - DE
          - DS
          - ML
        visual: "A picture of data first: the same group difference drawn from an observational and from a randomized assignment, with the confounder as a third bar."
        sources:
          - title: OpenIntro Statistics (free textbook)
            url: https://www.openintro.org/book/os/
            verified: false
          - title: "Seeing Theory (Brown University): a visual introduction to probability and statistics"
            url: https://seeing-theory.brown.edu/
            verified: true
        research: 02 §4.1 (data types and study design); 03 §3.4 (picture first, formula last)
        notes: Opens the statistics half. Never open with a formula, a Greek letter or a prerequisite warning (03 §3.4 domain cautions). Random assignment vs random sampling are two different jobs; flagged for later lessons.
      - id: core-center-and-spread
        slug: center-and-spread
        title: "Center and spread: mean, median and standard deviation"
        description: Summarize a column with its center and spread, and see when the mean misleads and the median does not.
        order: 20
        level: beginner
        duration: 25
        objectives:
          - Compute mean, median and mode and say when each misleads
          - Compute range, IQR and standard deviation
          - Read percentiles and a box plot
          - Write a two-sentence plain-language summary of a column
        prerequisites:
          - core-study-design-and-data-types
          - python-charts
        datasets: &a6
          - cafe-sales
        tool: colab
        careers:
          - DA
          - DE
          - DS
          - ML
        visual: Dot plot of a skewed column with mean and median marked; the same data after an extra-zero outlier is added, the mean moving and the median staying.
        sources:
          - title: OpenIntro Statistics (free textbook)
            url: https://www.openintro.org/book/os/
            verified: false
          - title: "Seeing Theory: Basic probability"
            url: https://seeing-theory.brown.edu/basic-probability/index.html
            verified: true
          - title: NIST/SEMATECH e-Handbook of Statistical Methods
            url: https://www.itl.nist.gov/div898/handbook/
            verified: false
        research: 02 §4.1 (descriptive statistics); 03 §3.4 (rung 2 compute and say it)
        notes: Order amounts show why median beats mean (03 §8.5 e-wallet and coffee-shop examples; outlier day from an extra zero). Sample vs population SD named here, used in confidence intervals. Excel functions (STDEV, MEDIAN, PERCENTILE) in the reference area.
      - id: core-distributions-and-outliers
        slug: distributions-and-outliers
        title: Distributions, z-scores and outliers
        description: Read the shape of a distribution, use z-scores and the normal curve for orientation, and investigate outliers instead of deleting them.
        order: 30
        level: beginner
        duration: 25
        objectives:
          - Describe a distribution by shape, center and spread
          - Compute and read a z-score
          - Apply the empirical rule as orientation, not as a test
          - Write an investigation note for an outlier before deciding to keep it
          - Compare two groups on center, spread and shape together
        prerequisites:
          - core-center-and-spread
        datasets: *a6
        tool: colab
        careers:
          - DA
          - DE
          - DS
          - ML
        visual: Histogram of order values splitting into two overlaid histograms when filtered by store; z-score axis printed under the bars.
        sources:
