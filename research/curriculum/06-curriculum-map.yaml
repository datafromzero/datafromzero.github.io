          - Explain base-rate neglect with an example
        prerequisites:
          - core-distributions-and-outliers
        datasets: *a7
        tool: colab
        careers:
          - DA
          - DE
          - DS
          - ML
        visual: A grid of 1,000 dots colored by condition and test result (natural frequencies), the two conditional probabilities read off as different row and column shares.
        sources:
