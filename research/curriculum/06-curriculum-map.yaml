            url: https://www.openintro.org/book/os/
            verified: false
        research: 02 §4.2 (probability foundations, Bayes); 03 §3.4
        notes: Natural frequencies before the formula; Bayes' theorem shown as relabeling the same table. Expected value included as one worked example; permutations and combinations at recognition level only. Probabilities shown as decimals and percents until the decimal-point reflex is secure (03 §8.4).
