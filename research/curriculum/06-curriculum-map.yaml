        sources:
          - title: "scikit-learn documentation: Cross-validation"
            url: https://scikit-learn.org/stable/modules/cross_validation.html
            verified: false
          - title: "pandas documentation: Time series / date functionality"
            url: https://pandas.pydata.org/docs/user_guide/timeseries.html
            verified: false
        research: 02 §6.2 B3 (time-series forecasting basics, backtesting by time)
        notes: Daily cafe revenue with Tet and sale days is the worked example; naming those events is part of the lesson.
      - id: data-scientist-experiment-analysis-in-python
        slug: experiment-analysis-in-python
        title: Analyzing experiments in Python
        description: Compute power, bootstrap intervals and sanity checks for an experiment, and say what sequential peeking does.
        order: 110
        level: advanced
        duration: 30
        objectives:
          - Compute a sample size from a minimum detectable effect
          - Bootstrap an interval for a ratio or median
          - Run sample-ratio and balance checks
          - Explain novelty effects and the value of a long-term holdout
        prerequisites:
          - core-experiments-ab-testing
          - core-comparing-groups
        datasets: *a9
        tool: colab
        careers:
          - DS
        visual: Power curves for several effect sizes with the chosen design point marked; a bootstrap histogram with its interval.
        sources:
          - title: Kohavi, Tang and Xu, Trustworthy Online Controlled Experiments (book site)
            url: https://experimentguide.com/
            verified: false
          - title: "SciPy documentation: Statistical functions (scipy.stats)"
            url: https://docs.scipy.org/doc/scipy/reference/stats.html
            verified: false
          - title: "statsmodels documentation: Linear regression"
            url: https://www.statsmodels.org/stable/regression.html
            verified: false
        research: 02 §4.3 (A/B testing end to end; Bayesian A/B at recognition level)
        notes: Causal inference methods beyond randomization (difference-in-differences) remain recognition-level pointers.
      - id: data-scientist-decision-product-case-study
        slug: decision-product-case-study
        title: "From model to decision: a case study"
        description: Frame a real decision, build and evaluate a model, deploy it in the lightest credible way and tell the story to a non-specialist.
        order: 120
        level: advanced
        duration: 30
        objectives:
          - Frame a problem with a named stakeholder, decision and success definition
          - Report evaluation with a baseline, an error analysis and honest limits
          - Describe deployment, monitoring and a retraining trigger at least on paper
          - Write the case study in Problem-Solution-Impact form
        prerequisites:
          - data-scientist-model-interpretation-and-fairness
          - data-scientist-experiment-analysis-in-python
          - core-telling-the-story
        datasets: *a9
        tool: none
        careers:
          - DS
        visual: A one-page case-study template with the five scoring dimensions (framing, data realism, evaluation rigor, deployment thinking, communication) as labeled boxes.
        sources:
          - title: "Google for Developers: Rules of Machine Learning"
            url: https://developers.google.com/machine-learning/guides/rules-of-ml
            verified: false
          - title: OSSU Data Science curriculum (GitHub)
            url: https://github.com/ossu/data-science
            verified: true
        research: 05 §3.3 (DS bar, five dimensions); 05 §3.5 (DS capstone ladder)
        notes: "DS proof: 3-5 projects (1-2 deeply told), notebook-only work is the standard failure mode. Reserved-beginner-dataset rule applies. Which deployment form is taught (API, dashboard, scheduled report) is an open question."
  - stage: ml-engineer
    summary: "Ship machine learning systems: leakage-safe pipelines, tracking, deep learning basics, LLM and RAG applications with evaluation, serving and monitoring."
    lessons:
      - id: ml-engineer-sklearn-pipelines-and-column-transformers
        slug: sklearn-pipelines-and-column-transformers
        title: "scikit-learn pipelines: one leakage-safe object"
        description: Wrap preprocessing and a model in one Pipeline with a ColumnTransformer so fitting and scoring never leak.
        order: 10
        level: intermediate
        duration: 30
        objectives:
          - Build a ColumnTransformer for numeric and categorical columns
          - Chain preprocessing and a model in a Pipeline
          - Cross-validate the whole pipeline
          - Save and reload the fitted pipeline
        prerequisites:
          - data-scientist-feature-engineering
          - data-scientist-cross-validation-and-overfitting
        datasets: *a9
        tool: colab
        careers:
          - ML
        visual: A pipeline drawn as boxes with the fit-on-train boundary shown and the same boxes applied to new data.
        sources:
          - title: "scikit-learn documentation: Pipelines and composite estimators"
            url: https://scikit-learn.org/stable/modules/compose.html
            verified: false
          - title: "scikit-learn documentation: Model persistence"
            url: https://scikit-learn.org/stable/model_persistence.html
            verified: false
          - title: "scikit-learn documentation: Common pitfalls and recommended practices (data leakage)"
            url: https://scikit-learn.org/stable/common_pitfalls.html
            verified: false
        research: 02 §6.2 B6 (scikit-learn production patterns)
        notes: "Opens the ML Engineer branch. Cross-branch prerequisites on the Data Scientist branch cover the shared modeling lessons: first model, cross-validation, trees, boosting, feature engineering (see rationale)."
      - id: ml-engineer-experiment-tracking-and-reproducibility
        slug: experiment-tracking-and-reproducibility
        title: Tracking experiments and making runs reproducible
        description: Log parameters, metrics and artifacts for every run, and pin seeds, data versions and the environment.
        order: 20
        level: intermediate
        duration: 30
        objectives:
          - Log parameters, metrics and artifacts for a run
          - Compare runs and register the best model
          - Pin the random seed, data version and environment
          - Reproduce a past run from its record
        prerequisites:
          - ml-engineer-sklearn-pipelines-and-column-transformers
          - core-git-branches-and-pull-requests
        datasets: *a9
        tool: colab
        careers:
          - ML
        visual: A table of runs with parameters and scores, one run traced to its code commit, data version and environment.
        sources:
          - title: MLflow documentation
            url: https://mlflow.org/docs/latest/
            verified: false
          - title: Pro Git (book)
            url: https://git-scm.com/book/en/v2
            verified: false
        research: "02 §6.2 B11 (MLOps basics: experiment tracking, reproducibility); 05 §3.3 (ML bar)"
        notes: Tool choice (MLflow in the docs here) is an owner question; the lesson teaches the practice.
      - id: ml-engineer-tuning-and-class-imbalance
        slug: tuning-and-class-imbalance
        title: Tuning hyperparameters and handling imbalanced classes
        description: Search settings with cross-validation, handle rare positive classes with weights and thresholds, and avoid tuning on the test set.
        order: 30
        level: advanced
        duration: 30
        objectives:
          - Run a grid or random search with cross-validation
          - Keep a final test set untouched
          - Apply class weights or resampling and compare them with a threshold change
          - Report the tuned result next to the baseline
        prerequisites:
          - ml-engineer-sklearn-pipelines-and-column-transformers
          - data-scientist-gradient-boosting
        datasets: *a9
        tool: colab
        careers:
          - ML
        visual: A search grid colored by cross-validated score with the chosen cell marked; a precision-recall curve with two threshold points.
        sources:
          - title: "scikit-learn documentation: Tuning hyper-parameters"
            url: https://scikit-learn.org/stable/modules/grid_search.html
            verified: false
          - title: "scikit-learn documentation: Metrics and scoring"
            url: https://scikit-learn.org/stable/modules/model_evaluation.html
            verified: false
        research: 02 §6.2 B6 (search, imbalance handling)
        notes: Tuning on the test set is the leakage hunt of this lesson.
      - id: ml-engineer-neural-networks-and-training-loop
        slug: neural-networks-and-training-loop
        title: Neural networks and the training loop
        description: Build a small neural network, follow the training loop of batches, loss and learning rate, and watch it overfit.
        order: 40
        level: advanced
        duration: 30
        objectives:
          - Describe a neuron, a layer and a loss function
          - "Explain the training loop: forward pass, loss, backward pass, update"
          - Train a small network in PyTorch on tabular data
          - Read a training and validation loss plot
        prerequisites:
          - ml-engineer-sklearn-pipelines-and-column-transformers
          - core-linear-regression-basics
        datasets: *a9
        tool: colab
        careers:
          - ML
        visual: "A small network drawn with weights as line thickness over three static frames: forward values, loss, updated weights."
        sources:
          - title: "3Blue1Brown: Neural networks"
            url: https://www.3blue1brown.com/topics/neural-networks
            verified: false
          - title: "PyTorch tutorials: Learn the basics"
            url: https://pytorch.org/tutorials/beginner/basics/intro.html
            verified: false
          - title: "Google for Developers: Machine Learning Crash Course"
            url: https://developers.google.com/machine-learning/crash-course
            verified: false
        research: 02 §6.2 B8 (intro deep learning); 00 §3 (state the math assumed)
        notes: "Math assumed and stated on the page: slopes (from the regression lesson) and what a derivative means by picture; linear algebra and calculus are not taught here and no prerequisite course is claimed (00 §3 mathematics note). Deep learning follows classical ML on purpose (02 §6.3)."
      - id: ml-engineer-deep-learning-training-practice
        slug: deep-learning-training-practice
        title: "Training deep models well: regularization and transfer learning"
        description: Control overfitting with dropout and early stopping, and start from a pretrained model instead of from scratch.
        order: 50
        level: advanced
        duration: 30
        objectives:
          - Add dropout and early stopping and compare validation curves
          - Explain batch size and learning rate effects
          - Reuse a pretrained model for a small dataset
          - Keep a single-number metric and compare with a baseline
        prerequisites:
          - ml-engineer-neural-networks-and-training-loop
        datasets: *a9
        tool: colab
        careers:
          - ML
        visual: Validation loss curves with and without each control; a pretrained backbone with a replaced head.
        sources:
          - title: "PyTorch tutorials: Learn the basics"
            url: https://pytorch.org/tutorials/beginner/basics/intro.html
            verified: false
          - title: "Hugging Face documentation: Transformers"
            url: https://huggingface.co/docs/transformers/index
            verified: false
          - title: "Google for Developers: Rules of Machine Learning"
            url: https://developers.google.com/machine-learning/guides/rules-of-ml
            verified: false
        research: 02 §6.2 B8 (overfitting controls, transfer learning); CNN and RNN at awareness level
        notes: CNNs and RNN/LSTM are awareness-level pointers; computer vision is not a lesson (see rationale).
      - id: ml-engineer-text-embeddings-and-transformers
        slug: text-embeddings-and-transformers
        title: "Text as numbers: tokens, embeddings and transformers"
        description: Turn text into tokens and embeddings, compare meaning with cosine similarity and read what attention does in plain language.
        order: 60
        level: advanced
        duration: 30
        objectives:
          - Explain tokens, not words, as the unit a model reads
          - Compute and compare embeddings with cosine similarity
          - Describe attention and the encoder-decoder idea in plain words
          - Run a pretrained model for classification
          - Fit a TF-IDF and logistic baseline first
        prerequisites:
          - ml-engineer-neural-networks-and-training-loop
        tool: colab
        careers:
          - ML
        visual: Words as points in a 2-D embedding map with cosine angles drawn between two pairs; a token-split strip for one sentence.
        sources:
          - title: "Hugging Face documentation: Transformers"
            url: https://huggingface.co/docs/transformers/index
            verified: false
          - title: Sentence Transformers documentation
            url: https://www.sbert.net/
            verified: false
          - title: Vaswani et al., Attention Is All You Need (arXiv)
            url: https://arxiv.org/abs/1706.03762
            verified: false
        research: 02 §6.2 B9 (NLP and transformers at user level; the classical baseline that still matters)
        notes: Modeling treatment of NLP; the assistant-and-verification treatment is owned by the core AI literacy lesson. Practice text is a short course-written document set, not a tabular dataset.
      - id: ml-engineer-llm-apis-and-structured-output
        slug: llm-apis-and-structured-output
        title: Calling LLM APIs and getting structured output
        description: Call a language-model API, control temperature, require JSON output, validate it and keep a cost and latency budget.
        order: 70
        level: advanced
        duration: 30
        objectives:
          - Send a request and read the response and token counts
          - Require and validate structured JSON output
          - Version a prompt like code and test it on examples
          - Keep a cost and latency budget per request
        prerequisites:
          - ml-engineer-text-embeddings-and-transformers
          - core-ai-literacy-rag-and-agents
          - python-apis-and-web-data
        tool: colab
        careers:
          - ML
        visual: A request-response diagram with token counts, a validation gate and a retry arrow.
        sources:
          - title: "Requests documentation: Quickstart"
            url: https://requests.readthedocs.io/en/latest/user/quickstart/
            verified: false
          - title: "NIST: AI Risk Management Framework"
            url: https://www.nist.gov/itl/ai-risk-management-framework
            verified: false
        research: "02 §6.2 B10 (LLM application skills: APIs, prompts as code, structured output, cost and latency)"
        notes: Prompt engineering is one layer, not a career skill; its durable core is evaluation and structured output (02 §6.3). The provider used in examples is an owner question; lessons stay provider-neutral where possible. Keys never in notebooks.
      - id: ml-engineer-rag-retrieval-pipeline
        slug: rag-retrieval-pipeline
        title: "A retrieval pipeline: chunk, embed, search, answer with citations"
        description: "Build a small retrieval-augmented system: chunk documents, embed them, search, and answer with citations or abstain."
        order: 80
        level: advanced
        duration: 30
        objectives:
          - Chunk documents and explain the size trade-off
          - Embed chunks and run a similarity search
          - Pass retrieved text to a model and return an answer with citations
          - Make the system abstain when nothing relevant is found
        prerequisites:
          - ml-engineer-llm-apis-and-structured-output
        tool: colab
        careers:
          - ML
        visual: "The RAG pipeline with the checkable artifact at each stage: chunks, scores, prompt, answer with citations."
        sources:
          - title: Lewis et al., Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks (arXiv)
            url: https://arxiv.org/abs/2005.11401
            verified: false
          - title: Sentence Transformers documentation
            url: https://www.sbert.net/
            verified: false
          - title: OWASP Top 10 for Large Language Model Applications
            url: https://owasp.org/www-project-top-10-for-large-language-model-applications/
            verified: false
        research: 02 §6.2 B10 (embeddings, vector databases, RAG end to end); 05 §3.3 (retrieval over proprietary data ships far more often than custom fine-tunes)
        notes: "Retrieval before fine-tuning: prompt first, RAG second, fine-tune last. Fine-tuning appears only as a decision, not a lesson."
      - id: ml-engineer-llm-and-rag-evaluation
        slug: llm-and-rag-evaluation
        title: Evaluating LLM and RAG systems
        description: Build a small golden set and a trap set, score answers on correctness, citation and refusal, and regression-test prompt changes.
        order: 90
        level: advanced
        duration: 30
        objectives:
          - Write a golden dataset with expected answers and sources
          - Score answers with a rubric and know the limits of an LLM judge
          - Include trap questions and measure refusal behavior
          - Run the evaluation before and after a prompt change
        prerequisites:
          - ml-engineer-rag-retrieval-pipeline
          - core-metrics-and-error-costs
        tool: colab
        careers:
          - ML
        visual: "An evaluation table: question, expected answer, system answer, scores for correctness, citation and refusal, one regression flagged."
        sources:
          - title: "NIST: AI Risk Management Framework"
            url: https://www.nist.gov/itl/ai-risk-management-framework
            verified: false
          - title: "Google for Developers: Rules of Machine Learning"
            url: https://developers.google.com/machine-learning/guides/rules-of-ml
            verified: false
        research: "02 §6.2 B10 (LLM evaluation); 02 §6.3 (under-taught: evaluation of LLM applications); 02 §7 (ML/AI track electives)"
        notes: Evaluation is graded work, not a lecture. A cost and latency budget accompanies the result.
      - id: ml-engineer-agents-tools-and-guardrails
        slug: agents-tools-and-guardrails
        title: Agents, tool use and guardrails
        description: Add tool calls to a model with approval gates, logged traces and defenses against prompt injection.
        order: 100
        level: advanced
        duration: 30
        objectives:
          - Describe tool use and structured function calls
          - Add a human approval gate to a risky action
          - Read a trace to find where an agent went wrong
          - Explain prompt injection and one defense
        prerequisites:
          - ml-engineer-llm-and-rag-evaluation
        tool: colab
        careers:
          - ML
        visual: "A workflow vs agent comparison diagram: fixed steps on one side, a model-chosen loop on the other, with approval gates and a trace log."
        sources:
          - title: OWASP Top 10 for Large Language Model Applications
            url: https://owasp.org/www-project-top-10-for-large-language-model-applications/
            verified: false
          - title: "NIST: AI Risk Management Framework"
            url: https://www.nist.gov/itl/ai-risk-management-framework
            verified: false
        research: "02 §7 (agents literacy, build-level elective); 02 §6.3 (agents as a starting topic is oversold: placed after evaluation)"
        notes: Placed after APIs, evaluation and data plumbing on purpose. A workflow is preferred over an agent unless the task needs one.
      - id: ml-engineer-serving-a-model-api
        slug: serving-a-model-api
        title: Serving a model behind an API
        description: Wrap a model in an API with input validation and a health check, package it in a container and deploy it to a reachable URL.
        order: 110
        level: advanced
        duration: 30
        objectives:
          - Write an endpoint that validates input and returns a prediction
          - Add a health check
          - Package the service in a container
          - Deploy it and put the live URL at the top of the README
        prerequisites:
          - ml-engineer-experiment-tracking-and-reproducibility
          - core-cloud-storage-compute-and-access
          - core-git-branches-and-pull-requests
        datasets: *a9
        tool: colab
        careers:
          - ML
        visual: "Request path: client, validation, model, response, with the container boundary and the health-check arrow."
        sources:
          - title: "FastAPI documentation: Tutorial"
            url: https://fastapi.tiangolo.com/tutorial/
            verified: false
          - title: "Docker documentation: Get started"
            url: https://docs.docker.com/get-started/
            verified: false
          - title: "scikit-learn documentation: Model persistence"
            url: https://scikit-learn.org/stable/model_persistence.html
            verified: false
        research: 02 §6.2 B11 (model packaging and serving); 05 §3.3 (deployed systems beat notebooks)
        notes: Free-tier deployment is an owner question. Deployed systems beat notebooks is the dividing line of this track.
      - id: ml-engineer-monitoring-drift-and-retraining
        slug: monitoring-drift-and-retraining
        title: Monitoring, drift and retraining
        description: Watch a deployed model for drift, latency and cost, and define when to retrain, roll back or stop.
        order: 120
        level: advanced
        duration: 30
        objectives:
          - Tell data drift from concept drift
          - Log inputs, predictions, latency and cost
          - Set an alert and a retraining trigger
          - Add a test that fails the build when quality drops
          - Define a rollback plan
        prerequisites:
          - ml-engineer-serving-a-model-api
          - ml-engineer-experiment-tracking-and-reproducibility
        datasets: *a9
        tool: none
        careers:
          - ML
        visual: "A monitoring panel sketch: input distribution against training, quality over time, alert and retrain arrows."
        sources:
          - title: "Google for Developers: Rules of Machine Learning"
            url: https://developers.google.com/machine-learning/guides/rules-of-ml
            verified: false
          - title: MLflow documentation
            url: https://mlflow.org/docs/latest/
            verified: false
        research: 02 §6.2 B11 (monitoring and drift, retraining triggers, CI/CD for models at concept level); 05 §3.5 (ML ladder rung 3)
        notes: "Track exit: a shipped system in one primary shape (retrieval default, agentic, or classical platform), architecture diagram, one measurable operating result, short recorded demo."
