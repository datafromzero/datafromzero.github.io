glossary:
  - id: glossary-primary-key
    slug: primary-key
    term: Primary key
    short: A column whose value uniquely identifies each row.
    used_in:
      - sql-relational-model
  - id: glossary-foreign-key
    slug: foreign-key
    term: Foreign key
    short: A column that holds the primary key of a row in another table, linking the two.
    used_in:
      - sql-relational-model
  - id: glossary-grain
    slug: grain
    term: Grain
    short: What one row of a table represents, such as one row per customer per month.
    used_in:
      - sql-relational-model
      - core-grain-facts-and-dimensions
  - id: glossary-tidy-data
    slug: tidy-data
    term: Tidy data
    short: A table where each variable is a column, each observation a row and each fact lives in one cell.
    used_in:
      - excel-grid-and-tidy-layout
      - python-pandas-reshape-wide-long
  - id: glossary-relative-reference
    slug: relative-reference
    term: Relative reference
    short: A cell address that shifts when a formula is copied to another cell.
    used_in:
      - excel-cell-references
  - id: glossary-absolute-reference
    slug: absolute-reference
    term: Absolute reference
    short: A cell address locked with $ so it does not shift when a formula is copied.
    used_in:
      - excel-cell-references
  - id: glossary-stored-value
    slug: stored-value
    term: Stored value
    short: The value a cell actually holds, which can differ from what its number format displays.
    used_in:
      - excel-numbers-dates-text-types
  - id: glossary-locale
    slug: locale
    term: Locale
    short: Regional settings that decide list separators, decimal marks and date order on a machine or file.
    used_in:
      - excel-numbers-dates-text-types
  - id: glossary-delimiter
    slug: delimiter
    term: Delimiter
    short: The character that separates fields in a text file such as a CSV.
    used_in:
      - excel-numbers-dates-text-types
      - python-files-csv-json
  - id: glossary-pivot-table
    slug: pivot-table
    term: PivotTable
    short: A summary table that groups rows and aggregates values without changing the source data.
    used_in:
      - excel-pivottables-build
  - id: glossary-aggregate
    slug: aggregate
    term: Aggregate
    short: A value computed from many rows, such as a count, sum or average.
    used_in:
      - excel-conditional-totals
      - sql-aggregate-functions
  - id: glossary-mapping-table
    slug: mapping-table
    term: Mapping table
    short: A two-column table that turns each messy label into one clean label.
    used_in:
      - excel-cleaning-workflow
  - id: glossary-null
    slug: "null"
    term: "NULL"
    short: A marker for a missing or unknown value; it is not zero and not an empty string.
    used_in:
      - sql-null-handling
  - id: glossary-join
    slug: join
    term: Join
    short: Combining rows from two tables by pairing rows that share a key value.
    used_in:
      - sql-inner-join
  - id: glossary-anti-join
    slug: anti-join
    term: Anti-join
    short: A join pattern that returns rows of one table that have no match in another.
    used_in:
      - sql-left-join-anti-join
  - id: glossary-fan-out
    slug: fan-out
    term: Fan-out
    short: Rows multiplying after a join on a non-unique key, which inflates counts and totals.
    used_in:
      - sql-join-fanout
  - id: glossary-cte
    slug: cte
    term: CTE
    short: A named query step defined with WITH that later steps can read from.
    used_in:
      - sql-ctes
  - id: glossary-window-function
    slug: window-function
    term: Window function
    short: A calculation over a set of related rows that keeps every row in the result.
    used_in:
      - sql-window-functions
  - id: glossary-deduplication
    slug: deduplication
    term: Deduplication
    short: Reducing repeated records to one row per entity under a stated survivor rule.
    used_in:
      - sql-deduplicate-latest-record
  - id: glossary-funnel
    slug: funnel
    term: Funnel
    short: An ordered set of steps with the number of users reaching each one.
    used_in:
      - sql-funnels
  - id: glossary-cohort
    slug: cohort
    term: Cohort
    short: A group of users defined by a shared starting event, such as the signup month.
    used_in:
      - sql-cohort-retention
  - id: glossary-retention
    slug: retention
    term: Retention
    short: The share of a cohort that comes back in a later period, under a stated definition.
    used_in:
      - sql-cohort-retention
      - core-defining-metrics
  - id: glossary-constraint
    slug: constraint
    term: Constraint
    short: A rule a table enforces on its data, such as NOT NULL, UNIQUE or CHECK.
    used_in:
      - sql-create-table-constraints
  - id: glossary-transaction
    slug: transaction
    term: Transaction
    short: A group of changes that either all take effect or none do.
    used_in:
      - sql-modify-data-transactions
  - id: glossary-normalization
    slug: normalization
    term: Normalization
    short: Splitting data into related tables so each fact is stored in one place.
    used_in:
      - sql-normalization
  - id: glossary-index
    slug: index
    term: Index
    short: A lookup structure that lets the database find rows without reading the whole table.
    used_in:
      - sql-indexes-and-explain
  - id: glossary-notebook
    slug: notebook
    term: Notebook
    short: A document of code and text cells that run in order and show their output.
    used_in:
      - python-first-notebook
  - id: glossary-traceback
    slug: traceback
    term: Traceback
    short: The report Python prints when an error stops a program, read from the bottom up.
    used_in:
      - python-errors-and-debugging
  - id: glossary-dataframe
    slug: dataframe
    term: DataFrame
    short: A pandas table with labeled columns and an index.
    used_in:
      - python-dataframe-first-look
  - id: glossary-vectorization
    slug: vectorization
    term: Vectorization
    short: Applying an operation to a whole column at once instead of looping over rows.
    used_in:
      - python-numpy-vectorization
  - id: glossary-api
    slug: api
    term: API
    short: A set of rules that lets one program request data or actions from another.
    used_in:
      - python-apis-and-web-data
  - id: glossary-mean
    slug: mean
    term: Mean
    short: The sum of the values divided by how many there are.
    used_in:
      - core-center-and-spread
  - id: glossary-median
    slug: median
    term: Median
    short: The middle value when the values are sorted; half the values are below it.
    used_in:
      - core-center-and-spread
  - id: glossary-standard-deviation
    slug: standard-deviation
    term: Standard deviation
    short: A measure of how far values typically sit from their mean.
    used_in:
      - core-center-and-spread
  - id: glossary-outlier
    slug: outlier
    term: Outlier
    short: A value far from the rest that should be investigated before it is kept or removed.
    used_in:
      - core-distributions-and-outliers
  - id: glossary-base-rate
    slug: base-rate
    term: Base rate
    short: How common something is in the whole population, before any test or clue.
    used_in:
      - core-probability-and-base-rates
  - id: glossary-conditional-probability
    slug: conditional-probability
    term: Conditional probability
    short: The chance of one event given that another has happened.
    used_in:
      - core-probability-and-base-rates
  - id: glossary-selection-bias
    slug: selection-bias
    term: Selection bias
    short: Error that arises because the sample was chosen in a way that favors some members.
    used_in:
      - core-sampling-and-bias
  - id: glossary-survivorship-bias
    slug: survivorship-bias
    term: Survivorship bias
    short: Error from looking only at what remained and ignoring what dropped out.
    used_in:
      - core-sampling-and-bias
  - id: glossary-standard-error
    slug: standard-error
    term: Standard error
    short: How much a sample statistic, such as a mean, varies from sample to sample.
    used_in:
      - core-sampling-variability-clt
  - id: glossary-central-limit-theorem
    slug: central-limit-theorem
    term: Central Limit Theorem
    short: Averages of many samples form a bell-shaped distribution, whatever the data looked like.
    used_in:
      - core-sampling-variability-clt
  - id: glossary-confidence-interval
    slug: confidence-interval
    term: Confidence interval
    short: A range from a sample that, over many repeats, covers the true value a stated share of the time.
    used_in:
      - core-confidence-intervals
  - id: glossary-null-hypothesis
    slug: null-hypothesis
    term: Null hypothesis
    short: The default claim that there is no difference or effect, which a test tries to challenge.
    used_in:
      - core-hypothesis-testing
  - id: glossary-p-value
    slug: p-value
    term: P-value
    short: How surprising the data would be if the null hypothesis were true; not the chance it is true.
    used_in:
      - core-hypothesis-testing
  - id: glossary-statistical-power
    slug: statistical-power
    term: Statistical power
    short: The chance a test detects a real effect of a given size.
    used_in:
      - core-experiments-ab-testing
  - id: glossary-effect-size
    slug: effect-size
    term: Effect size
    short: How large a difference is, in the units of the data or in standard deviations.
    used_in:
      - core-comparing-groups
  - id: glossary-confounder
    slug: confounder
    term: Confounder
    short: A third factor that influences both the cause and the outcome and distorts their link.
    used_in:
      - core-correlation-and-causation
  - id: glossary-simpsons-paradox
    slug: simpsons-paradox
    term: Simpson's paradox
    short: A trend that appears in a whole dataset but reverses within each group.
    used_in:
      - core-correlation-and-causation
  - id: glossary-correlation
    slug: correlation
    term: Correlation
    short: A measure of how closely two variables move together, which does not show cause.
    used_in:
      - core-correlation-and-causation
  - id: glossary-regression
    slug: regression
    term: Regression
    short: Fitting a line or curve that relates an outcome to one or more inputs.
    used_in:
      - core-linear-regression-basics
  - id: glossary-residual
    slug: residual
    term: Residual
    short: The gap between an observed value and the value a model predicts.
    used_in:
      - core-linear-regression-basics
  - id: glossary-guardrail-metric
    slug: guardrail-metric
    term: Guardrail metric
    short: A metric that must not get worse while you try to improve the main one.
    used_in:
      - core-defining-metrics
  - id: glossary-ab-test
    slug: ab-test
    term: A/B test
    short: An experiment that randomly assigns users to two versions and compares outcomes.
    used_in:
      - core-experiments-ab-testing
  - id: glossary-baseline
    slug: baseline
    term: Baseline
    short: A trivial prediction rule a real model must beat to count as having skill.
    used_in:
      - core-framing-split-and-baseline
  - id: glossary-train-test-split
    slug: train-test-split
    term: Train-test split
    short: Dividing data into a part to fit a model and a held-out part to judge it.
    used_in:
      - core-framing-split-and-baseline
  - id: glossary-data-leakage
    slug: data-leakage
    term: Data leakage
    short: Information from outside the training data or from the future that makes a model look better than it is.
    used_in:
      - core-data-leakage
  - id: glossary-overfitting
    slug: overfitting
    term: Overfitting
    short: A model that fits the training data too closely and fails on new data.
    used_in:
      - data-scientist-cross-validation-and-overfitting
  - id: glossary-confusion-matrix
    slug: confusion-matrix
    term: Confusion matrix
    short: A table of correct and incorrect predictions by class.
    used_in:
      - core-metrics-and-error-costs
  - id: glossary-precision-and-recall
    slug: precision-and-recall
    term: Precision and recall
    short: Precision is the share of flagged items that are right; recall is the share of real items found.
    used_in:
      - core-metrics-and-error-costs
  - id: glossary-commit
    slug: commit
    term: Commit
    short: A saved snapshot of a project in Git with a message describing the change.
    used_in:
      - core-git-save-history
  - id: glossary-branch
    slug: branch
    term: Branch
    short: A separate line of work in Git that can later be merged back.
    used_in:
      - core-git-branches-and-pull-requests
  - id: glossary-pull-request
    slug: pull-request
    term: Pull request
    short: A proposal to merge a branch, opened for review and checks.
    used_in:
      - core-git-branches-and-pull-requests
  - id: glossary-fact-table
    slug: fact-table
    term: Fact table
    short: A table of events or measurements at one stated grain, such as order lines.
    used_in:
      - core-grain-facts-and-dimensions
  - id: glossary-dimension-table
    slug: dimension-table
    term: Dimension table
    short: A table of descriptive attributes, such as customers or products, that facts refer to.
    used_in:
      - core-grain-facts-and-dimensions
  - id: glossary-star-schema
    slug: star-schema
    term: Star schema
    short: A model with one fact table at the center and dimension tables around it.
    used_in:
      - core-designing-a-star-schema
  - id: glossary-object-storage
    slug: object-storage
    term: Object storage
    short: A cloud service that stores files as objects in buckets, addressed by name.
    used_in:
      - core-cloud-storage-compute-and-access
  - id: glossary-data-warehouse
    slug: data-warehouse
    term: Data warehouse
    short: A database built for analytical queries over large, structured, modeled data.
    used_in:
      - core-warehouses-lakes-and-cost
  - id: glossary-data-lake
    slug: data-lake
    term: Data lake
    short: A store of raw files in many formats, organized when read rather than when written.
    used_in:
      - core-warehouses-lakes-and-cost
  - id: glossary-rag
    slug: rag
    term: RAG
    short: "Retrieval-augmented generation: a model answers using passages retrieved from your documents."
    used_in:
      - core-ai-literacy-rag-and-agents
  - id: glossary-etl-and-elt
    slug: etl-and-elt
    term: ETL and ELT
    short: "Moving data in three steps: extract, transform and load, or extract, load and then transform."
    used_in:
      - data-engineer-etl-elt-and-layers
  - id: glossary-idempotent
    slug: idempotent
    term: Idempotent
    short: An operation that gives the same result however many times it is run.
    used_in:
      - data-engineer-incremental-loads-idempotency
  - id: glossary-orchestration
    slug: orchestration
    term: Orchestration
    short: Scheduling and monitoring the steps of a pipeline and their dependencies.
    used_in:
      - data-engineer-orchestration-with-airflow
  - id: glossary-backfill
    slug: backfill
    term: Backfill
    short: Running a pipeline over past time ranges to fill or repair history.
    used_in:
      - data-engineer-backfills-and-failure-recovery
  - id: glossary-dbt-model
    slug: dbt-model
    term: dbt model
    short: A SELECT statement saved as a file that dbt builds into a table or view.
    used_in:
      - data-engineer-dbt-project-and-first-model
  - id: glossary-materialization
    slug: materialization
    term: Materialization
    short: "How a model is stored when built: as a view, a table or incremental data."
    used_in:
      - data-engineer-materializations-and-incremental-models
  - id: glossary-slowly-changing-dimension
    slug: slowly-changing-dimension
    term: Slowly changing dimension
    short: A dimension whose attributes change over time and may need history kept.
    used_in:
      - data-engineer-dimensional-models-and-scd
  - id: glossary-embedding
    slug: embedding
    term: Embedding
    short: A list of numbers that represents the meaning of text so similar texts sit close together.
    used_in:
      - ml-engineer-text-embeddings-and-transformers
  - id: glossary-token
    slug: token
    term: Token
    short: A piece of text, often part of a word, that a language model reads as one unit.
    used_in:
      - ml-engineer-text-embeddings-and-transformers
  - id: glossary-prompt-injection
    slug: prompt-injection
    term: Prompt injection
    short: Text in the input that tricks a language model into ignoring its instructions.
    used_in:
      - ml-engineer-agents-tools-and-guardrails
  - id: glossary-data-drift
    slug: data-drift
    term: Data drift
    short: A change in the input data a deployed model sees compared with its training data.
    used_in:
      - ml-engineer-monitoring-drift-and-retraining
