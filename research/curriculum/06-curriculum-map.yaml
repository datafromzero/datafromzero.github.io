stages:
  - stage: excel
    summary: Learn the grid, formulas, lookups, PivotTables and cleaning habits in Excel and Google Sheets on the same small datasets used later in SQL and Python.
    lessons:
      - id: excel-grid-and-tidy-layout
        slug: grid-and-tidy-layout
        title: Rows, columns and tidy layout
        description: "See a sheet as a table of records: one header row, one fact per cell, no merged cells, and raw data kept apart from calculations."
        order: 10
        level: beginner
        duration: 20
        objectives:
          - Describe a dataset as rows (records) and columns (fields)
          - Spot merged cells, blank rows and multi-fact cells that break later analysis
          - Separate raw data, calculations and outputs onto different sheets
          - Count the rows and columns of a supplied sheet from the status bar
        prerequisites: []
        datasets: &a1
          - cafe-sales
        tool: sheets
        careers:
          - DA
          - DE
          - DS
          - ML
        visual: "One sheet shown twice: a messy layout (merged title, blank rows, two facts in one cell) crossed out beside the tidy layout, labels on the grid itself."
        sources:
          - title: "Microsoft Support: Excel help and learning"
            url: https://support.microsoft.com/en-us/excel
            verified: false
          - title: Wickham, Tidy Data (Journal of Statistical Software)
            url: https://www.jstatsoft.org/article/view/v059i10
            verified: false
          - title: "Google Docs Editors Help: Google Sheets function list"
            url: https://support.google.com/docs/table/25273
            verified: false
        research: 02 §1.1; 03 §3.1 (Excel); 03 §2.1 (local-environment honesty)
        notes: First lesson of the path, so it must deliver a first real result inside 20 minutes (see how many orders cafe-sales holds, read from the status bar). Introduce the three-sheet habit (raw, calc, output) here and keep it for the whole path. Sheets and Excel are taught side by side; menu names differ, grid behavior does not.
      - id: excel-first-formulas
        slug: first-formulas
        title: Your first formulas
        description: Write formulas with operators, SUM, AVERAGE, MIN, MAX and COUNT, and read the order of operations without guessing.
        order: 20
        level: beginner
        duration: 20
        objectives:
          - Write a formula that starts with = and uses cell addresses
          - Use SUM, AVERAGE, MIN, MAX and COUNT on a range
          - Predict the result of a formula with mixed operators and parentheses
          - Fill a formula down a column
        prerequisites:
          - excel-grid-and-tidy-layout
        datasets: *a1
        tool: sheets
        careers:
          - DA
          - DE
          - DS
          - ML
        visual: A formula cell with colored arrows to the cells it reads; the same cell shown before and after fill-down.
        sources:
          - title: "Microsoft Support: Excel functions (by category)"
            url: https://support.microsoft.com/en-us/office/excel-functions-by-category-5f91f4e9-7b42-46d2-9bd1-63f26a86c0eb
            verified: false
          - title: "Google Docs Editors Help: Google Sheets function list"
            url: https://support.google.com/docs/table/25273
            verified: false
        research: 02 §1.1, §1.2 (math and statistics); 03 §3.1
        notes: "Function names are NOT localized in Vietnamese Excel: teach SUM, never a Vietnamese name (00 §4 rule 10). Standing /vi/ callout: if your Excel rejects the comma in a formula, use a semicolon; same formula. Do not state which separator a Vietnamese machine uses; it depends on the learner's own regional settings."
      - id: excel-cell-references
        slug: cell-references
        title: Relative and absolute references
        description: Predict what a formula becomes when copied down or across, and lock the parts that must not move with $.
        order: 30
        level: beginner
        duration: 25
        objectives:
          - Predict a copied formula from its original and the copy direction
          - Lock a row, a column or both with $
          - Fix a formula that breaks when filled down
          - Explain why one correct cell is not yet a correct column
        prerequisites:
          - excel-first-formulas
        datasets: *a1
        tool: sheets
        careers:
          - DA
          - DE
          - DS
          - ML
        visual: "Annotated grid: a formula in one cell and the values it becomes when copied down and across, locked and moving parts in two colors."
        sources:
          - title: "Microsoft Support: Excel functions (by category)"
            url: https://support.microsoft.com/en-us/office/excel-functions-by-category-5f91f4e9-7b42-46d2-9bd1-63f26a86c0eb
            verified: false
        research: 03 §3.1 (visual and rung 1 Predict); 05 §2.2 task type 7
        notes: Rung-1 "Predict" exercises (write what the formula becomes without touching the keyboard). Heavily tested in hiring and rarely taught explicitly. New mental model, so up to 25 minutes.
      - id: excel-numbers-dates-text-types
        slug: numbers-dates-text-types
        title: Numbers are not numbers until you check
        description: Tell the stored value from the displayed one, and catch text-numbers, text-dates and locale separators before they corrupt a total.
        order: 40
        level: beginner
        duration: 25
        objectives:
          - Compare the formula-bar value with the displayed value of a cell
          - Detect numbers and dates stored as text with ISNUMBER and a left-aligned check
          - Check imported dates for a day-month swap by looking for a day above 12
          - Explain how regional settings change separators and CSV parsing
        prerequisites:
          - excel-first-formulas
        datasets:
          - messy-orders-export
        tool: sheets
        careers:
          - DA
          - DE
          - DS
          - ML
        visual: "Three-panel cell anatomy: what you see, what is stored (formula bar), and what a SUM sees, with the same value as text and as a number."
        sources:
          - title: "Microsoft Support: Change the character used to separate thousands or decimals"
            url: https://support.microsoft.com/en-us/office/change-the-character-used-to-separate-thousands-or-decimals-c093b545-71cb-4903-b205-aebb9837bd1e
            verified: false
          - title: "Office Watch: Excel formulas in different languages, how it works"
            url: https://office-watch.com/2026/excel-formulas-different-languages-how-it-works/
            verified: true
          - title: "Google Docs Editors Help: Change spreadsheet locale and settings"
            url: https://support.google.com/docs/answer/58515
            verified: false
          - title: "Microsoft Support: Import or export text (.txt or .csv) files"
            url: https://support.microsoft.com/en-us/office/import-or-export-text-txt-or-csv-files-5250ac4c-663c-47ce-937b-339e391393ba
            verified: false
        research: 03 §8.4 (Excel correction, numbers, dates); 00 §4 rule 10
        notes: "Locale trap lesson. Teach the DIAGNOSTIC (check the stored value, check your own regional settings, import CSV with explicit delimiter and decimal), never assert a fixed Vietnamese separator. Plant three traps in VND data: 1.500.000 read as 1.5, text-dates with day <= 12, decimal VND. Recalled at the first money lesson in SQL and Python. Google Sheets has its own per-file locale setting; name both."
      - id: excel-tables-sort-filter
        slug: tables-sort-filter
        title: Tables, sorting and filtering
        description: Turn a range into an Excel Table, then sort and filter it without scrambling rows or hiding data you still need to total.
        order: 50
        level: beginner
        duration: 20
        objectives:
          - Convert a range into a Table with a single header row
          - Sort by one and by several columns without breaking row integrity
          - Filter rows by value, text and date
          - Total a filtered list with SUBTOTAL so hidden rows are left out
        prerequisites:
          - excel-cell-references
          - excel-numbers-dates-text-types
        datasets: *a1
        tool: sheets
        careers:
          - DA
          - DE
          - DS
          - ML
        visual: "Row-flow gate: a stack of order rows passing a filter gate, hidden rows shown dimmed with their row numbers skipping."
        sources:
          - title: "Microsoft Support: Overview of Excel tables"
            url: https://support.microsoft.com/en-us/office/overview-of-excel-tables-7ab0bb7d-3a9e-4b56-a3c9-6c94334e492c
            verified: false
          - title: "Microsoft Support: Excel functions (by category)"
            url: https://support.microsoft.com/en-us/office/excel-functions-by-category-5f91f4e9-7b42-46d2-9bd1-63f26a86c0eb
            verified: false
        research: 02 §1.3; 05 §2.2 task type 1
        notes: Hiring task 1 (tidy and total a list with live formulas). Introduces SUBTOTAL as the filtered-total function; structured references only mentioned. The row-flow gate artwork is reused in SQL WHERE and pandas filtering (03 §7.2 rule 3).
      - id: excel-if-logic
        slug: if-logic
        title: Decisions with IF, AND and OR
        description: Add a flag column that labels each row with IF, AND and OR, the first half of the flag-then-aggregate pattern.
        order: 60
        level: beginner
        duration: 20
        objectives:
          - Write an IF that returns one of two labels
          - Combine conditions with AND and OR
          - Nest IF or use IFS for three or more outcomes
          - Add a flag column to a Table and check it by eye
        prerequisites:
          - excel-tables-sort-filter
        datasets: *a1
        tool: sheets
        careers:
          - DA
          - DE
          - DS
          - ML
        visual: "Decision tree drawn over a column: each row flows to a branch, result column filling in beside it."
        sources:
          - title: "Microsoft Support: IF function"
            url: https://support.microsoft.com/en-us/office/if-function-69aed7c9-4e8a-4755-a9bc-aa8bbff73be2
            verified: false
          - title: "Microsoft Support: Excel functions (by category)"
            url: https://support.microsoft.com/en-us/office/excel-functions-by-category-5f91f4e9-7b42-46d2-9bd1-63f26a86c0eb
            verified: false
        research: 02 §1.2 (logic); 05 §2.2 task type 6
        notes: Taught as "build a label column, then count or sum by it" so the next lesson has something to aggregate. Same idea returns as SQL CASE and pandas np.where; name the pattern after the blank-start task.
      - id: excel-conditional-totals
        slug: conditional-totals
        title: Conditional totals with SUMIFS and COUNTIFS
        description: Total, count and average only the rows that meet your conditions, and avoid the argument-order trap between SUMIF and SUMIFS.
        order: 70
        level: beginner
        duration: 25
        objectives:
          - Write COUNTIFS and SUMIFS with one and with several conditions
          - Use AVERAGEIFS for a conditional average
          - Match criteria with comparison operators and wildcards
          - Reconcile a conditional total against a filtered list
        prerequisites:
          - excel-if-logic
        datasets: *a1
        tool: sheets
        careers:
          - DA
          - DE
          - DS
          - ML
        visual: "Buckets: rows dropping into labeled buckets by condition, each bucket showing its count and sum (the grouping artwork reused by PivotTable, GROUP BY and groupby)."
        sources:
          - title: "Microsoft Support: SUMIFS function"
            url: https://support.microsoft.com/en-us/office/sumifs-function-c9e748f5-7ea7-455d-9406-611cebce642b
            verified: false
          - title: "Microsoft Support: Excel functions (by category)"
            url: https://support.microsoft.com/en-us/office/excel-functions-by-category-5f91f4e9-7b42-46d2-9bd1-63f26a86c0eb
            verified: false
        research: 02 §1.2 (conditional aggregation); 05 §2.2 task type 6
        notes: "Contrast pair: SUMIF (range first) vs SUMIFS (sum range first). Verification step every time: reconcile with a filter plus SUBTOTAL. This is the spreadsheet form of GROUP BY with conditional aggregation."
      - id: excel-xlookup
        slug: xlookup
        title: Bring in a value by key with XLOOKUP
        description: Pull a price or attribute from another table by code, handle codes that are not found, and see lookup as the spreadsheet join.
        order: 80
        level: beginner
        duration: 25
        objectives:
          - Write an XLOOKUP with an exact match
          - Keep the lookup table fixed with absolute references
          - Return a readable not-found result instead of an error
          - Verify a lookup column by reconciling an extended total
        prerequisites:
          - excel-cell-references
          - excel-tables-sort-filter
        datasets: *a1
        tool: sheets
        careers:
          - DA
          - DE
          - DS
          - ML
        visual: Two small tables with arrows pairing rows on a key; one unmatched row highlighted; result column filling in.
        sources:
          - title: "Microsoft Support: XLOOKUP function"
            url: https://support.microsoft.com/en-us/office/xlookup-function-b7fd680e-6d10-43e6-84f9-88eae8bf5929
            verified: false
          - title: "Microsoft Support: Excel functions (by category)"
            url: https://support.microsoft.com/en-us/office/excel-functions-by-category-5f91f4e9-7b42-46d2-9bd1-63f26a86c0eb
            verified: false
        research: 03 §3.1 (lookup progression, rungs 2 and 4); 05 §2.2 task type 3
        notes: 'The highest-tested Excel skill in the hiring research. Teach ONE lookup as the default (XLOOKUP) and name legacy forms only in the next lesson. Frame as "the spreadsheet rehearsal for SQL joins": key, match, unmatched rows. Sheets also supports XLOOKUP; INDEX/MATCH remains the portable fallback.'
      - id: excel-legacy-lookups
        slug: legacy-lookups
        title: Reading VLOOKUP and INDEX with MATCH
        description: Read inherited workbooks that use VLOOKUP, HLOOKUP or INDEX with MATCH, and know the approximate-match trap.
        order: 90
        level: intermediate
        duration: 20
        objectives:
          - Translate a VLOOKUP into the equivalent XLOOKUP
          - Read an INDEX with MATCH formula piece by piece
          - Explain the approximate-match trap and why it returns wrong near-matches
          - Spot a hard-coded column number that breaks when a column is inserted
        prerequisites:
          - excel-xlookup
        datasets: *a1
        tool: sheets
        careers:
          - DA
          - DE
          - DS
          - ML
        visual: "Side-by-side formula anatomy: VLOOKUP, INDEX+MATCH and XLOOKUP over the same lookup table with matching parts color-coded."
        sources:
          - title: "Microsoft Support: Excel functions (alphabetical)"
            url: https://support.microsoft.com/en-us/office/excel-functions-alphabetical-b3944572-255d-4efb-bb96-c6d90033e188
            verified: false
          - title: "Microsoft Support: XLOOKUP function"
            url: https://support.microsoft.com/en-us/office/xlookup-function-b7fd680e-6d10-43e6-84f9-88eae8bf5929
            verified: false
        research: 02 §1.2 (lookup and reference); 05 §2.2 task type 3
        notes: "Recognition only; no new lookup is to be written from scratch. Part of the repair rung: a lookup returning near-matches is one of the planted faults."
      - id: excel-text-functions
        slug: text-functions
