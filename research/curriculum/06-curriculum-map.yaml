  - stage: sql
    summary: "One complete SQL block before Python: retrieval, joins, aggregation, subqueries and CTEs, window functions, analytic patterns and design basics."
    lessons:
      - id: sql-relational-model
        slug: relational-model
        title: Tables, keys and grain
        description: "See a database as linked tables: rows, columns, primary and foreign keys, and the one-sentence grain statement before any query."
        order: 10
        level: beginner
        duration: 20
        objectives:
          - Describe a table in terms of rows, columns and a primary key
          - Explain how a foreign key links two tables
          - State the grain of a table in one sentence
          - Tell one-to-many from many-to-many from a diagram
        prerequisites:
          - excel-tables-sort-filter
          - excel-xlookup
        datasets: &a2
          - cafe-sales
        tool: colab
        careers:
          - DA
          - DE
          - DS
          - ML
        visual: Entity diagram of the cafe-sales tables with key columns marked and one row traced across a foreign-key arrow.
        sources:
          - title: "DuckDB documentation: SELECT statement"
            url: https://duckdb.org/docs/stable/sql/statements/select
            verified: false
          - title: "DuckDB documentation: Foreign keys"
            url: https://duckdb.org/docs/stable/sql/constraints#foreign-keys
            verified: false
        research: "02 §2.1; 03 §3.2 (framing ritual: grain statement)"
        notes: "First SQL lesson, so a first real result comes fast (open the notebook and read the first rows and the row count of orders; COUNT itself comes later). Spreadsheet bridge: an Excel Table is one table, XLOOKUP was a join. Engine stated on every page: DuckDB in Colab (SPEC D29); a callout notes where common warehouse SQL differs. Every blank-start task from the joins lesson onward begins with a grain statement."
