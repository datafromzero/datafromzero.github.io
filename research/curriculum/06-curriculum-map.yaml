            url: https://seeing-theory.brown.edu/probability-distributions/index.html
            verified: false
          - title: OpenIntro Statistics (free textbook)
            url: https://www.openintro.org/book/os/
            verified: false
          - title: NIST/SEMATECH e-Handbook of Statistical Methods
            url: https://www.itl.nist.gov/div898/handbook/
            verified: false
        research: 02 §4.1 (distributions, outliers, z-scores); 03 §3.4 domain cautions (outliers are investigated, never auto-deleted)
        notes: Binomial, Poisson and exponential only at recognition level (one picture each). The investigation note is what is scored, not the deletion.
      - id: core-probability-and-base-rates
        slug: probability-and-base-rates
        title: Probability, conditional probability and base rates
        description: "Reason about chance with natural frequencies: independent events, conditional probability read both ways, and Bayes with base rates first."
        order: 40
        level: intermediate
        duration: 30
        objectives:
          - Compute the probability of an event and of two independent events
          - Read P(A given B) and P(B given A) as different questions
