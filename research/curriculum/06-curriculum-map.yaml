          - title: "scikit-learn documentation: Inspection (permutation importance, partial dependence)"
            url: https://scikit-learn.org/stable/inspection.html
            verified: false
          - title: "Google for Developers: Machine Learning Crash Course"
            url: https://developers.google.com/machine-learning/crash-course
            verified: false
        research: 02 §6.2 B7 (interpretation, error-slice checks)
        notes: SHAP at user level (one example). The model card is part of the DS portfolio standard.
      - id: data-scientist-time-series-forecasting-basics
        slug: time-series-forecasting-basics
        title: Forecasting basics with honest backtesting
        description: Forecast with trend, seasonality and lag features, and test the forecast the way it will be used, by time.
        order: 100
        level: advanced
        duration: 30
        objectives:
