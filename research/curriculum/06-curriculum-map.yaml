  - stage: data-scientist
    summary: "Model with judgment: classical algorithms, validation, feature engineering, interpretation, forecasting and experiments, ending in a decision case study."
    lessons:
      - id: data-scientist-first-honest-model
        slug: first-honest-model
        title: Your first honest model with scikit-learn
        description: Fit a linear model with scikit-learn on a held-out split and compare it with the baseline, using the fit and predict grammar.
        order: 10
        level: intermediate
        duration: 30
        objectives:
          - Use fit, predict and score on a training and test split
          - Compare a first model with the baseline on held-out data
          - Read the coefficients in the units of the data
          - Write the verdict and a limitations line
        prerequisites:
          - core-metrics-and-error-costs
          - core-linear-regression-basics
        datasets: *a9
        tool: colab
        careers:
          - DS
          - ML
        visual: The one-way-street workflow with the wall between fit data and judge data, and the model's score printed beside the baseline.
        sources:
          - title: "scikit-learn documentation: Linear models"
            url: https://scikit-learn.org/stable/modules/linear_model.html
            verified: false
          - title: "scikit-learn documentation: Dummy estimators (baselines)"
            url: https://scikit-learn.org/stable/modules/generated/sklearn.dummy.DummyClassifier.html
            verified: false
          - title: "Google for Developers: Machine Learning Crash Course"
            url: https://developers.google.com/machine-learning/crash-course
            verified: false
        research: 02 §6.2 B0-B1, B3; 03 §3.5 (ML first honest model progression)
        notes: "Shared with the ML Engineer track (home of the sk-learn estimator grammar). Always prints the baseline score beside the model score. Math assumed: slopes and residuals from the regression lesson."
      - id: data-scientist-logistic-regression-in-practice
        slug: logistic-regression-in-practice
        title: "Logistic regression: predicting yes or no"
        description: Predict a yes-or-no outcome, read coefficients as odds, and choose a probability threshold from the cost of errors.
        order: 20
        level: intermediate
        duration: 30
        objectives:
          - Fit a logistic regression and predict probabilities
          - Read a coefficient as an odds ratio
          - Choose a threshold from false-positive and false-negative costs
          - Report precision and recall at that threshold
        prerequisites:
          - data-scientist-first-honest-model
        datasets: *a9
        tool: colab
        careers:
          - DS
        visual: An S-shaped probability curve over a feature with the threshold line and the two error regions shaded.
        sources:
          - title: "scikit-learn documentation: Linear models"
            url: https://scikit-learn.org/stable/modules/linear_model.html
            verified: false
          - title: "statsmodels documentation: Linear regression"
            url: https://www.statsmodels.org/stable/regression.html
            verified: false
          - title: "scikit-learn documentation: Metrics and scoring"
            url: https://scikit-learn.org/stable/modules/model_evaluation.html
            verified: false
        research: 02 §4.3 (logistic regression), §6.2 B3
        notes: "The churn question on app-events: who is likely to cancel. Imbalance is handled in the ML branch tuning lesson; here the threshold lesson suffices."
      - id: data-scientist-cross-validation-and-overfitting
        slug: cross-validation-and-overfitting
        title: Overfitting and cross-validation
        description: See overfitting as a gap between training and test error, and estimate a model's performance with cross-validation.
        order: 30
        level: intermediate
        duration: 30
        objectives:
          - Diagnose overfitting and underfitting from two error curves
          - Run k-fold cross-validation and read its spread
          - Use stratified and time-based folds when needed
          - Keep preprocessing inside each fold to avoid leakage
        prerequisites:
          - data-scientist-first-honest-model
        datasets: *a9
        tool: colab
        careers:
          - DS
          - ML
        visual: A complexity slider shown as static frames with training and test error curves tracing out and the best-fit point marked.
        sources:
          - title: "scikit-learn documentation: Cross-validation"
            url: https://scikit-learn.org/stable/modules/cross_validation.html
            verified: false
          - title: "R2D3: A visual introduction to machine learning, part 2 (bias and variance)"
            url: https://r2d3.us/visual-intro-to-machine-learning-part-2/
            verified: true
          - title: "Google for Developers: Machine Learning Crash Course"
            url: https://developers.google.com/machine-learning/crash-course
            verified: false
        research: 02 §6.2 B1 (cross-validation, bias-variance); 03 §7.1 (complexity slider)
        notes: Shared with the ML Engineer track. Error analysis before model shopping.
      - id: data-scientist-regularization
        slug: regularization
        title: "Regularization: keeping a model simple on purpose"
        description: Shrink coefficients with L1 and L2 penalties and choose the strength with cross-validation.
        order: 40
        level: intermediate
        duration: 25
        objectives:
          - Explain regularization as a penalty on large coefficients
          - Fit ridge and lasso models and compare coefficients
          - Choose the penalty strength with cross-validation
          - Say when scaling features matters
        prerequisites:
          - data-scientist-cross-validation-and-overfitting
          - data-scientist-logistic-regression-in-practice
        datasets: *a9
        tool: colab
        careers:
          - DS
        visual: Coefficient paths drawn as lines shrinking as the penalty grows, with the cross-validated choice marked.
        sources:
          - title: "scikit-learn documentation: Linear models"
            url: https://scikit-learn.org/stable/modules/linear_model.html
            verified: false
          - title: "scikit-learn documentation: Preprocessing data"
            url: https://scikit-learn.org/stable/modules/preprocessing.html
            verified: false
        research: 02 §6.2 B3 (regularization in plain terms)
        notes: Plain terms only; no optimization math.
      - id: data-scientist-decision-trees-and-forests
        slug: decision-trees-and-forests
        title: Decision trees and random forests
        description: Grow a decision tree by repeated splits, see why one tree overfits, and average many trees in a random forest.
        order: 50
        level: intermediate
        duration: 30
        objectives:
          - Describe how a tree chooses a split
          - Limit a tree's depth to control overfitting
          - Explain why averaging many trees helps
          - Read feature importances with caution
        prerequisites:
          - data-scientist-cross-validation-and-overfitting
        datasets: *a9
        tool: colab
        careers:
          - DS
          - ML
        visual: Scatterplot regions drawn beside a growing tree with synchronized partitions (static frames).
        sources:
          - title: "scikit-learn documentation: Decision trees"
            url: https://scikit-learn.org/stable/modules/tree.html
            verified: false
          - title: "scikit-learn documentation: Ensembles"
            url: https://scikit-learn.org/stable/modules/ensemble.html
            verified: false
          - title: "R2D3: A visual introduction to machine learning"
            url: http://r2d3.us/visual-intro-to-machine-learning-part-1/
            verified: true
        research: 02 §6.2 B3; 03 §7.1 (tree visual)
        notes: Shared with the ML Engineer track. Algorithm families are taught as models to frame, evaluate and explain, not to implement (02 §8.2).
      - id: data-scientist-gradient-boosting
        slug: gradient-boosting
        title: Gradient boosting
        description: Build a strong model from many small trees fitted in sequence, and tune the few settings that matter.
        order: 60
        level: advanced
        duration: 30
        objectives:
          - Explain boosting as fixing the previous model's errors
          - Fit a gradient boosting model and compare it with a forest
          - Tune learning rate, depth and number of trees with cross-validation
          - Stop early to avoid overfitting
        prerequisites:
          - data-scientist-decision-trees-and-forests
        datasets: *a9
        tool: colab
        careers:
          - DS
          - ML
        visual: A sequence of small trees, each correcting the residuals left by the sum so far, the error shrinking in a strip below.
        sources:
          - title: "scikit-learn documentation: Ensembles"
            url: https://scikit-learn.org/stable/modules/ensemble.html
            verified: false
          - title: "scikit-learn documentation: Tuning hyper-parameters"
            url: https://scikit-learn.org/stable/modules/grid_search.html
            verified: false
        research: 02 §6.2 B3 (gradient boosting class), B6
        notes: Shared with the ML Engineer track. k-NN, SVM and Naive Bayes at awareness level appear only in the reference area.
      - id: data-scientist-feature-engineering
        slug: feature-engineering
        title: Feature engineering
        description: "Turn raw columns into model inputs: imputation, encoding, transforms and date features, without leaking the answer."
        order: 70
        level: intermediate
        duration: 30
        objectives:
          - Impute missing values and keep a missing-indicator when it carries signal
          - Encode categories with one-hot and ordinal encodings
          - Apply log, binning and ratio transforms
          - Build date features such as weekday and days since signup
          - Fit every transform on the training part only
        prerequisites:
          - data-scientist-cross-validation-and-overfitting
          - python-pandas-reshape-wide-long
        datasets: *a9
        tool: colab
        careers:
          - DS
          - ML
        visual: A raw table on the left and the engineered feature matrix on the right, each new column labeled by the step that produced it, the leakage wall drawn between fit and judge.
        sources:
          - title: "scikit-learn documentation: Preprocessing data"
            url: https://scikit-learn.org/stable/modules/preprocessing.html
            verified: false
          - title: "scikit-learn documentation: Common pitfalls and recommended practices (data leakage)"
            url: https://scikit-learn.org/stable/common_pitfalls.html
            verified: false
          - title: "pandas documentation: Reshaping and pivot tables"
            url: https://pandas.pydata.org/docs/user_guide/reshaping.html
            verified: false
        research: 02 §6.2 B4 (feature engineering); 02 §3.2 (get_dummies)
        notes: Target encoding and its leakage risk named, not drilled. Text features (TF-IDF) at basics level only.
      - id: data-scientist-clustering-and-segmentation
        slug: clustering-and-segmentation
        title: "Clustering: finding groups without labels"
        description: Group similar customers with k-means, choose the number of groups sensibly, and describe each cluster in plain words.
        order: 80
        level: intermediate
        duration: 30
        objectives:
          - Explain how k-means assigns and updates clusters
          - Scale features before clustering and explain why
          - Choose the number of clusters and justify it
          - Describe each cluster in business language
          - Say what clustering cannot prove
        prerequisites:
