        notes: PCA, DBSCAN, t-SNE/UMAP and recommenders are awareness-level pointers only (excluded as full lessons; see rationale).
      - id: data-scientist-model-interpretation-and-fairness
        slug: model-interpretation-and-fairness
        title: Explaining a model and checking where it fails
        description: Explain a model with permutation importance and partial dependence, and check error rates across groups.
        order: 90
        level: advanced
        duration: 30
        objectives:
          - Compute permutation importance and read it with caution
          - Draw a partial dependence plot
          - Compare error rates across groups and name a fairness risk
          - Write a short model card
        prerequisites:
          - data-scientist-gradient-boosting
        datasets: *a9
        tool: colab
        careers:
          - DS
