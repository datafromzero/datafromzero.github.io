        description: Follow data from source to consumer through generate, ingest, store, transform and serve, and see where engineers differ from analysts.
        order: 10
        level: intermediate
        duration: 25
        objectives:
          - Name the five stages of the data lifecycle
          - Separate what data engineers, analysts and scientists own
          - Tell batch from streaming as a business decision with a price
          - Sketch a pipeline for a stated source and consumer
        prerequisites:
          - core-warehouses-lakes-and-cost
          - python-notebook-to-script
          - core-git-branches-and-pull-requests
        datasets: *a9
        tool: none
        careers:
          - DE
