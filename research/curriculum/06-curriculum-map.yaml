            verified: true
        research: 02 §6.1 A0 (ground rules); 03 §3.5 (canonical visual); 05 §3.3 (DE bar)
        notes: "Role boundary stated early: drawing business conclusions and ML training are outside the credential's scope (02 §9 DEA-C01). Opens the DE track; DE proof is 2-3 deep projects, not many shallow ones."
