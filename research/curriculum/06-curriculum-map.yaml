  - stage: data-engineer
    summary: "Build and operate reliable pipelines: ingestion, idempotent loads, quality checks, orchestration, backfills, dbt models in layers with tests, documentation and CI, dimensional models and distributed processing."
    lessons:
      - id: data-engineer-role-and-lifecycle
        slug: role-and-lifecycle
